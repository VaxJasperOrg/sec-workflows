name: Security Check

on: 
  workflow_call:
    inputs:
      # 将 inputs 设置为可选，并自动推导默认值
      project_key:
        description: 'SonarQube Project Key'
        required: false
        type: string
        default: ${{ github.repository_owner }}_${{ github.event.repository.name }}
      project_name:
        description: 'SonarQube Project Name'
        required: false
        type: string
        default: ${{ github.event.repository.name }}
      quality_gate_fail:
        description: 'Fail pipeline on Sonar Quality Gate failure?'
        required: false
        type: boolean
        default: true
      trivy_severity:
        description: 'Trivy severities (comma-separated)'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
    secrets:
      SONAR_HOST_URL:
        required: false
      SONAR_TOKEN:
        required: false
      CF_ACCESS_CLIENT_ID:
        required: false
      CF_ACCESS_CLIENT_SECRET:
        required: false
  # 中央workflow不需要进行检查
  # push:
  #   branches: [ main ]
  workflow_dispatch: 
env:
  EFFECTIVE_PROJECT_KEY: ${{ inputs.project_key || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
  EFFECTIVE_PROJECT_NAME: ${{ inputs.project_name || github.event.repository.name }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://appscan.vax-s.com' }}   # 生产环境sonar host地址
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  # CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
  # CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
  CF_PROXY_PORT: '8888'
  
jobs:
  sca-check:
    name: SCA Security Scan (Trivy) # Ruleset 可单独把这个 Job 设为强制门槛
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy SCA Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          exit-code: '1'
          severity: ${{ inputs.trivy_severity || 'CRITICAL,HIGH' }}
          format: 'table'
          output: 'trivy-results.txt'
          ignore-unfixed: true

      - name: Publish Trivy Scan to Job Summary
        if: always()
        run: |
          echo "## 🛡️ Trivy SCA 依赖与密钥漏洞扫描报告" >> $GITHUB_STEP_SUMMARY
          if [ -s trivy-results.txt ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat trivy-results.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ 未发现 HIGH / CRITICAL 级别的开源依赖漏洞或敏感信息泄露！" >> $GITHUB_STEP_SUMMARY
          fi
  # ============================================================
  # Job 2: SAST 代码质量与安全分析 (SonarQube)
  # ============================================================
  sast-check:
    name: SAST Code Scan (SonarQube) # 可以与 SCA 并行运行，互不干扰
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'  # 计划任务只做SCA扫描，不做代码安全扫描
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Project Tech Stack & Languages
        id: detect
        run: |
          HAS_MAVEN=false
          HAS_NODE=false
          HAS_PYTHON=false
          SOURCES_LIST=""

          # 探测 Java / Maven
          if [ -f "pom.xml" ]; then
            HAS_MAVEN=true
            echo "Detected Maven project (pom.xml found)."
          fi

          # 探测 Node.js / JavaScript / TypeScript
          if [ -f "package.json" ] || [ -d "src/javascript" ] || [ -n "$(find . -maxdepth 3 -name '*.js' -o -name '*.ts' 2>/dev/null)" ]; then
            HAS_NODE=true
            echo "Detected JavaScript/TypeScript code."
          fi

          # 探测 Python
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -d "src/python" ] || [ -n "$(find . -maxdepth 3 -name '*.py' 2>/dev/null)" ]; then
            HAS_PYTHON=true
            echo "Detected Python code."
          fi

          # 动态拼接需要扫描的源码路径
          DETECTED_DIRS=""
          for dir in src src/main/java src/python src/javascript lib app; do
            if [ -d "$dir" ]; then
              DETECTED_DIRS="${DETECTED_DIRS:+${DETECTED_DIRS},}${dir}"
            fi
          done
          [ -z "$DETECTED_DIRS" ] && DETECTED_DIRS="."

          echo "has_maven=${HAS_MAVEN}" >> $GITHUB_OUTPUT
          echo "has_node=${HAS_NODE}" >> $GITHUB_OUTPUT
          echo "has_python=${HAS_PYTHON}" >> $GITHUB_OUTPUT
          echo "sources=${DETECTED_DIRS}" >> $GITHUB_OUTPUT
      - name: Set up JDK 17
        if: steps.detect.outputs.has_maven == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Set up Node.js
        if: steps.detect.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Set up Python
        if: steps.detect.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'
      - name: Install JS & Python Dependencies
        run: |
          if [ "${{ steps.detect.outputs.has_node }}" = "true" ]; then
            if [ -f src/javascript/package.json ]; then
              (cd src/javascript && npm ci || npm install)
            elif [ -f package.json ]; then
              npm ci || npm install
            fi
          fi

          if [ "${{ steps.detect.outputs.has_python }}" = "true" ]; then
            if [ -f src/python/requirements.txt ]; then
              pip install -r src/python/requirements.txt
            elif [ -f requirements.txt ]; then
              pip install -r requirements.txt
            fi
          fi
      # --------------------------------------------------------
      # Step 3: 启动 Cloudflare Access Sidecar 代理 (如有必要)
      # --------------------------------------------------------
      # - name: Start Cloudflare Access Sidecar Proxy
      #   if: env.CF_ACCESS_CLIENT_ID != '' && env.CF_ACCESS_CLIENT_SECRET != ''
      #   run: |
      #     python proxy/cf-access-proxy.py --port "${CF_PROXY_PORT}" --target-url "${SONAR_HOST_URL}" &> /tmp/cf-proxy.log &
      #     echo $! > /tmp/cf-proxy.pid
      #     READY=false
      #     for i in $(seq 1 10); do
      #       if curl -s -o /dev/null http://localhost:${CF_PROXY_PORT}/api/server/version 2>/dev/null; then
      #         READY=true; echo "Proxy connected."; break
      #       fi
      #       sleep 1
      #     done
      #     if [ "$READY" = false ]; then echo "::error::Proxy failed."; cat /tmp/cf-proxy.log; exit 1; fi

      # - name: Determine Sonar Target URL
      #   id: sonar-endpoint
      #   run: |
      #     if [ -f /tmp/cf-proxy.pid ]; then
      #       echo "url=http://localhost:${CF_PROXY_PORT}" >> $GITHUB_OUTPUT
      #     else
      #       echo "url=${SONAR_HOST_URL}" >> $GITHUB_OUTPUT
      #     fi
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Ensure SonarQube Project Exists
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          PROJECT_KEY="${{ inputs.project_key }}"
          PROJECT_NAME="${{ inputs.project_name }}"
          TARGET_BRANCH="${{ github.event.pull_request.base.ref || github.ref_name }}"

          curl -s -X POST -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/projects/create" \
            -d "project=$PROJECT_KEY" \
            -d "name=$PROJECT_NAME" \
            -d "mainBranch=$TARGET_BRANCH" || true
      # 模式 A：包含 Maven/Java 项目 —— 使用 Maven 插件编译并扫描
      - name: Sonar Scan via Maven Plugin (Java / Hybrid)
        if: steps.detect.outputs.has_maven == 'true'
        run: |
          PR_KEY="${{ github.event.pull_request.number }}"
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          PR_BASE="${{ github.event.pull_request.base.ref }}"

          MAVEN_CMD="mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests"
          MAVEN_CMD="$MAVEN_CMD -Dsonar.host.url=${ SONAR_HOST_URL }"
          MAVEN_CMD="$MAVEN_CMD -Dsonar.login=${SONAR_TOKEN}"
          MAVEN_CMD="$MAVEN_CMD -Dsonar.projectKey=${EFFECTIVE_PROJECT_KEY}"
          MAVEN_CMD="$MAVEN_CMD -Dsonar.projectName=${EFFECTIVE_PROJECT_NAME}"
          MAVEN_CMD="$MAVEN_CMD -Dsonar.sources=${{ steps.detect.outputs.sources }}"
          MAVEN_CMD="$MAVEN_CMD -Dsonar.exclusions=**/node_modules/**,**/venv/**,**/target/**,**/*.min.js,proxy/**"

          if [ -n "$PR_KEY" ]; then
            MAVEN_CMD="$MAVEN_CMD -Dsonar.pullrequest.key=$PR_KEY -Dsonar.pullrequest.branch=$PR_BRANCH -Dsonar.pullrequest.base=$PR_BASE"
          fi

          eval $MAVEN_CMD
      # 模式 B：纯非 Java 项目 (Node.js/Python 等) —— 使用官方 CLI 动作扫描
      - name: Sonar Scan via CLI Action (Non-Maven / Script Languages)
        if: steps.detect.outputs.has_maven != 'true'
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.EFFECTIVE_PROJECT_KEY }}
            -Dsonar.projectName="${{ env.EFFECTIVE_PROJECT_NAME }}"
            -Dsonar.sources=${{ steps.detect.outputs.sources }}
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=**/node_modules/**,**/venv/**,**/target/**,**/*.min.js,proxy/**
            ${{ github.event.pull_request.number && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.event.pull_request.number, github.event.pull_request.head.ref, github.event.pull_request.base.ref) || '' }}

      # --------------------------------------------------------
      # Step 5: 后置清理与总结报告
      # --------------------------------------------------------
      - name: Cleanup Sidecar Proxy
        if: always()
        run: |
          if [ -f /tmp/cf-proxy.pid ]; then
            kill $(cat /tmp/cf-proxy.pid) 2>/dev/null || true
            rm -f /tmp/cf-proxy.pid
          fi
      - name: Publish SonarQube Summary
        if: always()
        run: |
          echo "### 📊 SonarQube Quality Scan Finished" >> $GITHUB_STEP_SUMMARY
          echo "Detected Maven: \`${{ steps.detect.outputs.has_maven }}\` | Node.js: \`${{ steps.detect.outputs.has_node }}\` | Python: \`${{ steps.detect.outputs.has_python }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Analyzed Sources: \`${{ steps.detect.outputs.sources }}\`" >> $GITHUB_STEP_SUMMARY
          echo "[View Dashboard In SonarQube](${SONAR_HOST_URL}/dashboard?id=${EFFECTIVE_PROJECT_KEY})" >> $GITHUB_STEP_SUMMARY
      
      # - name: Build and Sonar Check
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      #   run: |
      #     PR_KEY="${{ github.event.pull_request.number }}"
      #     PR_BRANCH="${{ github.event.pull_request.head.ref }}"
      #     PR_BASE="${{ github.event.pull_request.base.ref }}"

      #     MAVEN_CMD="mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests"
      #     MAVEN_CMD="$MAVEN_CMD -Dsonar.projectKey=${{ inputs.project_key }}"
      #     MAVEN_CMD="$MAVEN_CMD -Dsonar.projectName=${{ inputs.project_name }}"

