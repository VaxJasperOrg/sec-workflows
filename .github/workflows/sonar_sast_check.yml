name: Security Check

on: 
  workflow_call:
    inputs:
      # 将 inputs 设置为可选，并自动推导默认值
      project_key:
        required: false
        type: string
        default: ${{ github.repository_owner }}_${{ github.event.repository.name }}
      project_name:
        required: false
        type: string
        default: ${{ github.event.repository.name }}
    secrets:
      SONAR_HOST_URL:
        required: false
      SONAR_TOKEN:
        required: false
jobs:
  build-and-sast-check:
    name: Build and Sonar Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      # 关键步骤：在 Maven 扫描前，通过 API 确保项目存在且主分支为 main
      - name: Ensure SonarQube Project Exists
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          PROJECT_KEY="${{ inputs.project_key }}"
          PROJECT_NAME="${{ inputs.project_name }}"
          TARGET_BRANCH="${{ github.event.pull_request.base.ref || github.ref_name }}"

          echo "Checking if project $PROJECT_KEY exists in SonarQube..."
          
          # 1. 查询项目是否存在
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/projects/search?projects=$PROJECT_KEY")

          # 2. 如果项目不存在 (HTTP 200 但 search 返回 empty，或者返回 404)，则调用 API 显式创建
          # 注意：search 接口无论项目在不在通常都回 200，我们可以校验 JSON 内容或直接调用 create 接口（已存在会回 400，可ignore）
          
          echo "Ensuring project exists with mainBranch=$TARGET_BRANCH..."
          curl -s -X POST -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/projects/create" \
            -d "project=$PROJECT_KEY" \
            -d "name=$PROJECT_NAME" \
            -d "mainBranch=$TARGET_BRANCH" || true
      
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.
          cache: 'maven' # 启用 Maven 本地依赖缓存
      # 3. 预下载项目依赖到本地 ~/.m2（避免 Trivy 扫描时请求 Maven 远程服务器）
      - name: Resolve Maven dependencies
        run: mvn dependency:go-offline -B
        
      # 2. 运行 Trivy 进行依赖项 SCA 扫描，并生成 SonarQube 兼容格式的报告
      - name: Run Trivy SCA Scan (SonarQube format)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'             # 扫描文件系统中的依赖库（如 package.json, pom.xml, go.mod 等）
          scan-ref: '.'
          scanners: 'vuln'
          format: 'template'
          template: '@contrib/sonarqube.tpl'  # 使用 Trivy 内置的 SonarQube 模板
          output: 'trivy-results.json'
          ignore-unfixed: true        # （可选）仅报告有修复方案的漏洞
        continue-on-error: true       # 避免发现漏洞时中途卡死流程，保证结果导入 SonarQube
        
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
          
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
          
      - name: Build and Sonar Check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          PR_KEY="${{ github.event.pull_request.number }}"
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          PR_BASE="${{ github.event.pull_request.base.ref }}"

          MAVEN_CMD="mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests"
          MAVEN_CMD="$MAVEN_CMD -Dsonar.projectKey=${{ inputs.project_key }}"
          MAVEN_CMD="$MAVEN_CMD -Dsonar.projectName=${{ inputs.project_name }}"
          MAVEN_CMD="$MAVEN_CMD -Dsonar.externalIssuesReportPaths=trivy-results.json"

          # 如果是 Pull Request 事件，追加 PR 分析参数
          if [ -n "$PR_KEY" ]; then
            MAVEN_CMD="$MAVEN_CMD -Dsonar.pullrequest.key=$PR_KEY"
            MAVEN_CMD="$MAVEN_CMD -Dsonar.pullrequest.branch=$PR_BRANCH"
            MAVEN_CMD="$MAVEN_CMD -Dsonar.pullrequest.base=$PR_BASE"
          fi

          eval $MAVEN_CMD
