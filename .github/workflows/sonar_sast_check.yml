      #       MAVEN_CMD="$MAVEN_CMD -Dsonar.pullrequest.key=$PR_KEY"
      #       MAVEN_CMD="$MAVEN_CMD -Dsonar.pullrequest.branch=$PR_BRANCH"
      #       MAVEN_CMD="$MAVEN_CMD -Dsonar.pullrequest.base=$PR_BASE"
