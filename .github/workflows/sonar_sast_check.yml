name: Security Check

on: 
  workflow_call:
    inputs:
      # 将 inputs 设置为可选，并自动推导默认值
      project_key:
        required: false
        type: string
        default: ${{ github.repository_owner }}_${{ github.event.repository.name }}
      project_name:
        required: false
        type: string
        default: ${{ github.event.repository.name }}
jobs:
  build-and-sast-check:
    name: Build and Sonar Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and Sonar Check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          PR_KEY="${{ github.event.pull_request.number }}"
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          PR_BASE="${{ github.event.pull_request.base.ref }}"

          MAVEN_CMD = "mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests"
          MAVEN_CMD = $MAVEN_CMD -Dsonar.projectKey=${{ inputs.project_key }}"
          MAVEN_CMD="$MAVEN_CMD -Dsonar.projectName=${{ inputs.project_name }}"

          # 如果是 Pull Request 事件，追加 PR 分析参数
          if [ -n "$PR_KEY" ]; then
            MAVEN_CMD="$MAVEN_CMD -Dsonar.pullrequest.key=$PR_KEY"
            MAVEN_CMD="$MAVEN_CMD -Dsonar.pullrequest.branch=$PR_BRANCH"
            MAVEN_CMD="$MAVEN_CMD -Dsonar.pullrequest.base=$PR_BASE"
          fi

          eval $MAVEN_CMD
