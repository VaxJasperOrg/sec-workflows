name: Auto Inject Security Workflow

on:
  # 1. 定时任务：每天 UTC 2:00 (北京时间 10:00) 自动巡检
  schedule:
    - cron: '0 2 * * *'

  # 2. 支持手动触发：可随时立即巡检，并可选择强制覆盖更新
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式：scan=仅扫描未部署 security.yml 的仓库并钉钉告警(默认)；inject=扫描并自动注入'
        required: false
        type: choice
        default: scan
        options:
          - scan
          - inject
      force_update:
        description: '仅 inject 模式下生效：是否强行覆盖已存在的 security.yml (true/false)'
        required: false
        default: 'false'

jobs:
  scan-and-inject:
    name: Scan & Inject Security Workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 1. 使用 GitHub App 凭证生成跨仓库访问的临时 Token
      # -------------------------------------------------------------
      - name: Generate GitHub App Token
        id: generate-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # -------------------------------------------------------------
      # 2. 初始化 Python 环境
      # -------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # -------------------------------------------------------------
      # 3a. 扫描：巡检组织内所有仓库，识别未部署 security.yml 的仓库，
      #     结果写入 scan_results.json；scan 模式下存在未部署仓库时推送钉钉告警
      # -------------------------------------------------------------
      - name: Scan & Report Missing Security Workflows
        id: scan-repos
        env:
          # 使用步骤 1 中动态生成的临时 Token
          GITHUB_TOKEN: ${{ steps.generate-app-token.outputs.token }}
          ORG_NAME: ${{ github.repository_owner }}
          MODE: ${{ github.event.inputs.mode || 'scan' }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          python .github/scripts/auto_inject.py scan

      # -------------------------------------------------------------
      # 3b. 注入：仅当 mode=inject 时执行，为未部署的仓库自动注入 security.yml，
      #     并通过钉钉推送注入成功/失败结果
      # -------------------------------------------------------------
      - name: Auto Inject Security Workflows
        if: github.event.inputs.mode == 'inject'
        env:
          GITHUB_TOKEN: ${{ steps.generate-app-token.outputs.token }}
          ORG_NAME: ${{ github.repository_owner }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          python .github/scripts/auto_inject.py inject
